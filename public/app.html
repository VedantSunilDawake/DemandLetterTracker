<!DOCTYPE html>
<html>
<head>
<title>Builder Tracker</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f8;
}

.nav {
  background: #2c3e50;
  color: white;
  padding: 15px;
  font-size: 20px;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 8px;
  display: inline-block;
  width: 22%;
}

input, button {
  margin: 5px;
  padding: 8px;
}

table {
  width: 100%;
  background: white;
  margin-top: 20px;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

button {
  background: #3498db;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="nav">🏠 Builder Demand Tracker</div>

<div class="container">

<h3>Add Demand</h3>
<input id="stage" placeholder="Stage">
<input id="amount" placeholder="Amount">
<input id="due" type="date">
<input id="self" placeholder="Self Paid">
<input id="bank" placeholder="Bank Paid">

<input type="file" id="file">

<button onclick="addDemand()">Add Demand</button>

<h3>Dashboard</h3>

<div id="cards"></div>

<h3>Demand List</h3>

<table>
<thead>
<tr>
<th>Stage</th>
<th>Amount</th>
<th>Due</th>
<th>Self</th>
<th>Bank</th>
<th>File</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>
const propertyId = 1;

async function addDemand() {
  let fileName = "";

  const file = document.getElementById("file").files[0];
  if (file) {
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    fileName = data.file;
  }

  await fetch("/demand", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      propertyId,
      stage: stage.value,
      amount: amount.value,
      dueDate: due.value,
      status: "Pending",
      selfPaid: self.value || 0,
      bankPaid: bank.value || 0,
      file: fileName
    })
  });

  load();
}

async function load() {
  const res = await fetch(`/dashboard/${propertyId}`);
  const data = await res.json();

  document.getElementById("cards").innerHTML = `
    <div class="card">Total Demand: ₹${data.totalDemand}</div>
    <div class="card">Total Paid: ₹${data.totalPaid}</div>
    <div class="card">Pending: ₹${data.pending}</div>
  `;

  const demands = await fetch(`/demands/${propertyId}`).then(r => r.json());

  document.getElementById("table").innerHTML = demands.map(d => `
    <tr>
      <td>${d.stage}</td>
      <td>${d.amount}</td>
      <td>${d.dueDate}</td>
      <td>${d.selfPaid}</td>
      <td>${d.bankPaid}</td>
      <td>${d.file ? `<a href="/uploads/${d.file}" target="_blank">View</a>` : ""}</td>
    </tr>
  `).join("");
}

load();
</script>

</body>
</html>
