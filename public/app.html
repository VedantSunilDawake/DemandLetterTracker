<!DOCTYPE html>
<html>
<head>
<title>Builder Tracker</title>

<style>
body {
  font-family: 'Segoe UI';
  margin: 0;
  background: #f5f7fb;
}

.nav {
  background: #1e293b;
  color: white;
  padding: 15px 25px;
  font-size: 20px;
}

.container {
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.section {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
}

h3 {
  margin-bottom: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 10px;
}

input {
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:disabled {
  background: gray;
}

.cards {
  display: flex;
  gap: 10px;
}

.card {
  flex: 1;
  background: #f1f5f9;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #e2e8f0;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.error {
  color: red;
}
</style>
</head>

<body>

<div class="nav">🏠 Builder Tracker</div>

<div class="container">

<!-- ADD DEMAND -->
<div class="section">
<h3>Add Demand</h3>

<div class="form-group">
<label>Stage</label>
<input id="stage">
</div>

<div class="form-group">
<label>Amount</label>
<input id="amount" type="number">
</div>

<div class="form-group">
<label>Due Date</label>
<input id="due" type="date">
</div>

<div class="form-group">
<label>Self Paid (optional)</label>
<input id="self" type="number">
</div>

<div class="form-group">
<label>Bank Paid (optional)</label>
<input id="bank" type="number">
</div>

<div class="form-group">
<label>Upload File</label>
<input type="file" id="file">
</div>

<button id="addBtn" onclick="addDemand()">Add Demand</button>

<p class="error" id="error"></p>
</div>

<!-- DASHBOARD -->
<div class="section">
<h3>Dashboard</h3>

<div class="cards" id="cards"></div>
</div>

<!-- TABLE -->
<div class="section">
<h3>Demand List</h3>

<table>
<thead>
<tr>
<th>Stage</th>
<th>Amount</th>
<th>Due</th>
<th>Self</th>
<th>Bank</th>
<th>File</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

<script>
const propertyId = 1;
let isSubmitting = false;

async function addDemand() {
  if (isSubmitting) return;

  const stageVal = stage.value.trim();
  const amountVal = amount.value;
  const dueVal = due.value;

  // VALIDATION
  if (!stageVal || !amountVal || !dueVal) {
    error.innerText = "Stage, Amount and Due Date are required";
    return;
  }

  isSubmitting = true;
  addBtn.disabled = true;
  error.innerText = "";

  let fileName = "";

  const fileInput = document.getElementById("file").files[0];
  if (fileInput) {
    const formData = new FormData();
    formData.append("file", fileInput);

    const res = await fetch("/upload", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    fileName = data.file;
  }

  await fetch("/demand", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      propertyId,
      stage: stageVal,
      amount: Number(amountVal),
      dueDate: dueVal,
      status: "Pending",
      selfPaid: Number(self.value) || 0,
      bankPaid: Number(bank.value) || 0,
      file: fileName
    })
  });

  // RESET FORM
  stage.value = "";
  amount.value = "";
  due.value = "";
  self.value = "";
  bank.value = "";
  file.value = "";

  isSubmitting = false;
  addBtn.disabled = false;

  load();
}

async function load() {
  const res = await fetch(`/dashboard/${propertyId}`);
  const data = await res.json();

  cards.innerHTML = `
    <div class="card">Total Demand<br>₹${data.totalDemand}</div>
    <div class="card">Total Paid<br>₹${data.totalPaid}</div>
    <div class="card">Pending<br>₹${data.pending}</div>
  `;

  const demands = await fetch(`/demands/${propertyId}`).then(r => r.json());

  table.innerHTML = demands.map(d => `
    <tr>
      <td>${d.stage}</td>
      <td>₹${d.amount}</td>
      <td>${d.dueDate}</td>
      <td>₹${d.selfPaid}</td>
      <td>₹${d.bankPaid}</td>
      <td>${d.file ? `<a href="/uploads/${d.file}" target="_blank">View</a>` : "-"}</td>
    </tr>
  `).join("");
}

load();
</script>

</body>
</html>
